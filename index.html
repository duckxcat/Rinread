      <!-- EPUB 左右翻页点击区（仅 EPUB 模式显示） -->
      <div id="epub-zone-left" class="epub-zone left hidden"></div>
      <div id="epub-zone-right" class="epub-zone right hidden"></div>
      <!-- 章节浮层提示 -->
      <div id="chapter-label" class="chapter-label"></div>
    </div>

    <!-- 页数标识（右下角常驻显示：当前页 / 总页数） -->
    <div id="page-corner" class="page-corner"></div>

    <!-- 底部操作栏（默认隐藏） -->
    <div id="reader-bottombar" class="reader-bar bottombar hidden">
      <button id="btn-toc" class="bar-btn">目录</button>
      <div class="slider-wrap">
        <input type="range" id="progress-slider" min="0" max="1000" value="0">
        <div class="progress-hint">
          <span id="progress-label">0.0%</span>
          <span id="page-indicator"></span>
        </div>
      </div>
      <button id="btn-notes" class="bar-btn">笔记</button>
      <button id="btn-settings" class="bar-btn">设置</button>
    </div>

    <!-- 目录抽屉（左侧） -->
    <div id="panel-toc" class="side-panel left hidden">
      <div class="panel-header">目录</div>
      <div id="toc-list" class="panel-body"></div>
    </div>

    <!-- 笔记 / 摘录抽屉（右侧） -->
    <div id="panel-notes" class="side-panel right hidden">
      <div class="panel-header">笔记与摘录</div>
      <div class="panel-tabs">
        <button class="tab active" data-tab="highlights">摘录与笔记</button>
        <button class="tab" data-tab="bookmarks">书签</button>
        <button class="tab" data-tab="reflections">感想</button>
      </div>
      <div id="notes-list" class="panel-body"></div>
    </div>

    <!-- 阅读设置面板（底部弹出） -->
    <div id="panel-settings" class="bottom-panel hidden">
      <div class="settings-row">
        <span class="settings-label">字号</span>
        <button id="font-dec" class="round-btn">A-</button>
        <span id="font-size-val" class="settings-value">20</span>
        <button id="font-inc" class="round-btn">A+</button>
      </div>
      <div class="settings-row">
        <span class="settings-label">行距</span>
        <input type="range" id="line-height-slider" min="1.4" max="2.4" step="0.1" value="1.8">
        <span id="line-height-val" class="settings-value">1.8</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">边距</span>
        <input type="range" id="margin-slider" min="32" max="120" step="4" value="64">
        <span id="margin-val" class="settings-value">64</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">字重</span>
        <div class="seg-group">
          <button class="seg-btn" data-weight="400">常规</button>
          <button class="seg-btn" data-weight="500">中等</button>
          <button class="seg-btn" data-weight="700">加粗</button>
        </div>
      </div>
      <div class="settings-row themes-row">
        <span class="settings-label">主题</span>
        <div class="theme-swatch day" data-theme="day" title="纯白日间"></div>
        <div class="theme-swatch sepia" data-theme="sepia" title="护眼米色"></div>
        <div class="theme-swatch green" data-theme="green" title="护眼绿"></div>
        <div class="theme-swatch gray" data-theme="gray" title="浅灰"></div>
        <div class="theme-swatch blue" data-theme="blue" title="雾蓝"></div>
        <div class="theme-swatch night" data-theme="night" title="纯黑夜间"></div>
        <div class="theme-swatch paper" data-theme="paper" title="纸质感"></div>
      </div>
    </div>

    <!-- 划词悬浮菜单 -->
    <div id="selection-menu" class="selection-menu hidden">
      <button data-action="highlight">划线</button>
      <button data-action="note">写想法</button>
      <button data-action="copy">复制</button>
    </div>

    <!-- 笔记编辑弹窗 -->
    <div id="note-modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-header">
          <span>写想法</span>
          <button id="note-close" class="icon-btn">×</button>
        </div>
        <div id="note-quote" class="note-quote"></div>
        <textarea id="note-input" placeholder="写下你的想法…"></textarea>
        <div class="modal-footer">
          <button id="note-cancel" class="btn-ghost">取消</button>
          <button id="note-save" class="btn-primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 搜索面板（全屏） -->
    <div id="search-panel" class="search-panel hidden">
      <div class="search-header">
        <input id="search-input" type="text" placeholder="输入关键字，搜索全书">
        <button id="search-close" class="icon-btn">取消</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- 遮罩 -->
    <div id="overlay" class="overlay hidden"></div>
  </div>

  <!-- 编辑书籍信息弹窗（重命名 / 修改作者） -->
  <div id="rename-modal" class="modal modal-fixed hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span>编辑书籍信息</span>
        <button id="rename-close" class="icon-btn">×</button>
      </div>
      <label class="edit-label" for="rename-input">书名</label>
      <input id="rename-input" type="text" placeholder="输入书名" maxlength="80">
      <label class="edit-label" for="rename-author">作者</label>
      <input id="rename-author" type="text" placeholder="输入作者" maxlength="60">
      <div class="modal-footer">
        <button id="rename-cancel" class="btn-ghost">取消</button>
        <button id="rename-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 书籍右键菜单 -->
  <div id="book-menu" class="book-menu hidden">
    <button class="book-menu-item" data-action="cover">上传封面</button>
    <button class="book-menu-item" data-action="rename">重命名</button>
    <button class="book-menu-item" data-action="author">修改作者</button>
  </div>

  <!-- 封面上传（图片） -->
  <input type="file" id="cover-input" accept="image/*" hidden>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <!-- epub.js（解析 EPUB，需联网加载；可下载到本地 lib/ 后改 src） -->
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
